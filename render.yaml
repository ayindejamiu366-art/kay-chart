services:
  - type: web
    name: kay-chart-api
    env: node
    # A persistent disk is REQUIRED so nocturne.db and uploads survive deploys
    # and restarts, and Render only offers disks on paid plans (starter or up).
    # The free plan has no disk, so SQLite data would be wiped on every restart.
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: kay-chart-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      # Database + uploads live on the persistent disk (see server/paths.cjs).
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      # The installed Android app runs from https://localhost (Capacitor), so that
      # origin must stay in this list. Add your own web domain here if you use one.
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3001,https://localhost,capacitor://localhost,http://localhost,https://kay-chart-api.onrender.com
      - key: ADMIN_EMAIL
        value: admin@nocturne.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TRENDING_SYNC_INTERVAL
        value: 30
      # Secrets: Render prompts for these on first deploy; never put values here.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
