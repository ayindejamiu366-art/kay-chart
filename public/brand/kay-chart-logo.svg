<!-- viewBox fitted to the measured ink bounds (94,69)-(1310,336), with a small
     even margin so the lockup is optically centred rather than mathematically. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 45 1264 315" width="1264" height="315" role="img" aria-labelledby="kcLogoTitle">
  <title id="kcLogoTitle">Kay Chart</title>
  <defs>
    <linearGradient id="kcLogoLime" gradientUnits="userSpaceOnUse" x1="40" y1="330" x2="300" y2="60">
      <stop offset="0" stop-color="#8FE01A"/>
      <stop offset="0.5" stop-color="#B6F518"/>
      <stop offset="1" stop-color="#E4FF5C"/>
    </linearGradient>
  </defs>

  <!-- Transparent background: this lockup sits on whatever surface the app uses. -->
  <g transform="translate(20 20) scale(0.70)">
    <g fill="url(#kcLogoLime)" stroke="url(#kcLogoLime)" stroke-width="20" stroke-linejoin="round">
      <rect x="106" y="112" width="76" height="288" rx="20"/>
      <path d="M124 226 L166 288 L430 132 L388 70 Z"/>
      <path d="M166 224 L124 288 L388 442 L430 380 Z"/>
    </g>
    <path d="M240 202 L316 256 L240 310 Z" fill="#0A0A0F" stroke="#0A0A0F" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!--
    Wordmark, drawn as stroked geometry rather than <text>.

    An SVG wordmark made of live text renders in whatever font the viewer
    happens to have, so the same asset looks different in a browser tab, an
    Android WebView and a design tool. Outlining the letterforms keeps the
    lockup identical everywhere.

    "Kay" carries the lime gradient and "Chart" is set in the near-white of the
    app's text, matching the brand lockup: one colour for the name, one for the
    category.
  -->
  <!-- Wordmark group spans x=30..888 in local space, i.e. 450..1308 once
       translated. The viewBox is widened to 1400 so the whole lockup fits with
       the right margin the original did not have. -->
  <g transform="translate(420 90)">
    <g fill="none" stroke="url(#kcLogoLime)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <!-- K -->
      <path d="M30 10 L30 190"/>
      <path d="M30 100 L96 10"/>
      <path d="M30 100 L100 190"/>
      <!-- a -->
      <circle cx="168" cy="134" r="46"/>
      <path d="M214 78 L214 190"/>
      <!-- y -->
      <path d="M252 78 L292 158"/>
      <path d="M334 78 L276 246"/>
    </g>

    <g fill="none" stroke="#F1F1F7" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <!-- C -->
      <path d="M436 42 A52 52 0 1 0 436 158"/>
      <!-- h -->
      <path d="M492 10 L492 190"/>
      <path d="M492 138 Q492 92 540 92 Q588 92 588 138 L588 190"/>
      <!-- a -->
      <circle cx="672" cy="134" r="46"/>
      <path d="M718 78 L718 190"/>
      <!-- r -->
      <path d="M762 78 L762 190"/>
      <path d="M762 128 Q762 84 810 84"/>
      <!-- t -->
      <path d="M856 34 L856 158 Q856 190 890 190"/>
      <path d="M828 78 L888 78"/>
    </g>
  </g>
</svg>
